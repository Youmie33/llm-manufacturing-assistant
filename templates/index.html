<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>MES WI AI</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #343541;
    color: #fff;
}

.container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* 聊天區 */
.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* 訊息區 */
.message {
    margin-bottom: 16px;
    display: flex;
}

.user {
    justify-content: flex-end;
}

.bot {
    justify-content: flex-start;
}

.bubble {
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 70%;
    line-height: 1.6;
    white-space: pre-wrap;
}

/* 使用者 */
.user .bubble {
    background: #0b93f6;
}

/* AI */
.bot .bubble {
    background: #444654;
}

/* 輸入區 */
.input-box {
    display: flex;
    padding: 15px;
    background: #40414f;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    background: #19c37d;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <!-- 聊天區 -->
    <div class="chat-box" id="chat"></div>

    <!-- 輸入區 -->
    <div class="input-box">
        <input id="input" placeholder="輸入問題..." />
        <button onclick="send()">送出</button>
    </div>

</div>

<script>

/**
 * 顯示訊息到畫面
 * @param text 要顯示的文字
 * @param role user / bot
 */
function addMessage(text, role) {
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "message " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.innerHTML = text.replace(/\n/g, "<br>");

    div.appendChild(bubble);
    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return bubble; //  回傳給打字動畫用
}

//  打字效果
function typeText(element, text, speed = 20) {
    let i = 0;

    function typing() {
        if (i < text.length) {
            element.innerHTML += text[i] === "\n" ? "<br>" : text[i];
            i++;
            setTimeout(typing, speed);
        }
    }

    typing();
}

//  loading
function showLoading() {
    return addMessage("AI思考中...", "bot");
}

/**
 * 發送問題到後端 API
 */
async function send() {
    console.log("send 被呼叫");

    const input = document.getElementById("input");
    const msg = input.value.trim();

    // 如果沒有輸入就不送
    if (!msg) return;

    // 顯示使用者訊息
    addMessage(msg, "user");

    // 清空輸入框
    input.value = "";

try {
    console.log("發送 POST /ask");
    //  顯示 loading
    const loadingBubble = showLoading();
    
    const res = await fetch("/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ question: msg })
    });

    console.log("status:", res.status);

    const data = await res.json();

    console.log("API回來:", data);

    //  清掉 loading 內容
    loadingBubble.innerHTML = "";

    let formatted = "";

    // summary
    if (data.summary) {
        formatted += "【" + data.summary + "】\n\n";
    }

    // steps
    if (Array.isArray(data.steps)) {
        data.steps.forEach(step => {
            formatted += step.title + "\n";

            if (Array.isArray(step.items)) {
                step.items.forEach(item => {
                    formatted += item + "\n";
                });
            }

            formatted += "----------------\n";
        });
    }

    // notes
    if (Array.isArray(data.notes)) {
        formatted += "注意事項:\n";

        data.notes.forEach(note => {
            formatted += "- " + note + "\n";
        });
    }

    // 🔥 打字動畫
    typeText(loadingBubble, formatted);

} catch (err) {
    console.error("API錯誤:", err);
    addMessage("系統錯誤，請稍後再試", "bot");
}
}

</script>

</body>
</html>
